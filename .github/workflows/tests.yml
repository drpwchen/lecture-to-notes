name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Dependency-light tests on all three OSes. No models, no GPU, no network
  # beyond installing pytest: sanitizer, route plan, packaging metadata.
  # The viewer end-to-end tests skip here (no pandoc/ffmpeg) and run below.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8"
      - name: compile every script
        run: python -m compileall -q scripts tools ocr_bench tests
      - run: python -m pytest -q -rs

  # The hostile-content viewer fixture, exported for real and opened in a
  # headless browser over file://. LTN_REQUIRE_VIEWER_E2E makes a missing tool
  # fail the job instead of skipping the security tests.
  viewer-e2e:
    runs-on: ubuntu-latest
    env:
      LTN_REQUIRE_VIEWER_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pandoc + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc ffmpeg
      - run: python -m pip install "pytest>=8" playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs tests/test_viewer_hostile.py
