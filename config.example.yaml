# Stage B2 — high-quality OCR (Surya). Runs AFTER dedup on canonical, text-bearing
# slides only. RapidOCR (Stage B quick_ocr.py) stays as the cheap triage pass that
# feeds dedup + entropy + the skip gate. See reference/decisions.md#ocr-benchmark
# for the benchmark that chose Surya. Keep the fallback SHALLOW (surya -> rapidocr);
# no ensemble/voting.
ocr_engine:
  engine: surya
  # Machine-specific interpreter for the Surya venv. CONTRACT (2026-08-02): a missing
  # or non-existent file is NOT fatal — ocr_surya degrades to the `fallback` engine
  # below instead of exiting 2, so the pipeline still runs on a machine without Surya.
  surya_python: ''  # python.exe inside your Surya venv — empty => falls back to rapidocr
  fallback: rapidocr
  confidence_threshold: 0.60      # Surya page_confidence below this (e.g. handwritten) -> rapidocr fallback
  # Image-type routing implemented with Stage-B signals (no VLM needed yet):
  #   source==pdf            -> skip OCR (Path B already has clean pdf_text)        [no rework]
  #   no meaningful text      -> skip OCR (pure MRI / pure photo / decorative)
  #   has text                -> Surya (covers dense text / table / algorithm)
  #   Surya low-conf / error  -> RapidOCR fallback (handwritten etc.)
  skip_no_text:
    quick_text_len_max: 12          # below this AND density below -> treat as pure image, skip OCR
    density_max: 0.03

# ---------------------------------------------------------------------------
# export_web.py
