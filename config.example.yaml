# lecture-to-notes skill configuration — EXAMPLE / template
# Copy to config.yaml and fill in the machine-specific values marked below.
# Every blanked ('') value is optional: an env var overrides it, and when both
# are empty the pipeline degrades gracefully rather than failing.
# Edit weights/thresholds here without touching code. Synthesis (Stage F) reads this.
#
# Machine-specific paths live under `paths:` below — see config.example.yaml for a
# blank copy to start from on a new machine.

paths:
  # All optional. Resolution order for each: env var -> this file -> built-in default/None.
  # LECTURE_PAUSE_FLAG — cooperative GPU pause: while this file exists, GPU stages
  # wait (bounded) so two CUDA jobs never collide. Empty/missing => feature disabled.
  pause_flag: ''  # e.g. /path/to/batch/_PAUSE — empty => pause feature disabled
  # LECTURE_WHISPER_MODEL_DIR — where locally converted faster-whisper models live.
  # Empty/missing => aliases containing {whisper_model_dir} are unusable and the
  # HF hub names (e.g. large-v3) are the way to go.
  whisper_model_dir: ''  # e.g. /models/whisper — empty => use HF hub names like large-v3

models:
  # Alias -> model path or Hugging Face hub name, consumed by _common.resolve_model.
  aliases:
    breeze25: '{whisper_model_dir}/breeze-asr-25-ct2'
    large-v3: 'large-v3'   # HF hub name, auto-downloaded by faster-whisper

# Stage C dedup (dedup_semantic.py). ui_chrome_tokens = screen-share interface
# text that pollutes RapidOCR quick_text on conference-recorded lectures; any
# quick_text LINE containing one of these tokens is dropped before quick_text
# length is used to pick a group's canonical frame (so the frame with the most
# UI noise doesn't win over the one with the most slide content). Add Teams/Meet/
# WebEx chrome here without editing code (WP1-6, 2026-07-09). Empty/omitted → the
# built-in Zoom default in dedup_semantic._DEFAULT_UI_CHROME_TOKENS.
dedup:
  ui_chrome_tokens:
    - 聊天
    - 劇天
    - 人員
    - 舉手
    - 最手
    - 翠手
    - 卑手
    - 取得控制權
    - 控制權
    - 檢視
    - 检视
    - 照相機
    - 照相格
    - 照相
    - 簽到
    - 保密
    - 視訊
    - 麥克風
    - 共享
    - 邀請
    - 錄製
    - 反應
    - 暫停
    - 結束會議
    - 停止共享
    - 新的共享
    - 多雲
    - 時睛
    - 未證
    - 靜音
    - 解除

scoring:
  # Each weight applies to the matching transcript_signals or vlm_signals field.
  # combined_score starts as sum(weight * signal), then add bonuses + penalties, clip to [0, 1].
  weights:
    visual_complexity: 0.15                   # vlm_signals.visual_complexity
    non_textual_information_density: 0.25     # vlm_signals.non_textual_information_density
    speaker_reference_density: 0.30           # transcript_signals.speaker_reference_density
    speaker_emphasis_score: 0.15              # transcript_signals.speaker_emphasis_score
    time_spent_normalized: 0.15               # min(transcript_signals.time_spent_seconds / 120, 1.0)

  penalties:
    speaker_skip_score: -0.30                 # multiplied by transcript_signals.speaker_skip_score
    speaker_confusion_score: -0.20            # multiplied by transcript_signals.speaker_confusion_score
    text_redundancy_threshold: 0.7            # if vlm_signals.text_redundancy > this, apply penalty
    text_redundancy_penalty: -0.20

  # Added to raw score for each matching content_type. Use `t in vlm_signals.content_type`, not equality.
  content_type_bonuses:
    flowchart: 0.15
    kaplan_meier: 0.15
    ultrasound: 0.10
    xray: 0.10
    mri: 0.10
    anatomy: 0.08
    scatter_plot: 0.08
    decorative: -0.40

  tier_thresholds:
    tier_1: 0.65
    tier_2: 0.40

  hard_overrides:
    # If any item in this list appears in vlm_signals.apparent_educational_function,
    # force tier 1 regardless of combined_score. Sets tier_override_reason.
    force_tier_1_if_function_includes:
      - diagnostic_algorithm
      - treatment_protocol
      - staging_schema

    # If vlm_signals.content_type set equals ONLY this list (no other types), force tier 3.
    # Set as list-of-lists so YAML keeps each variant distinct.
    force_tier_3_if_content_type_only_set:
      - [decorative]
      - [title]
      - [title, decorative]

